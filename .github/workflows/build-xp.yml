name: Build Windows XP 32-bit

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-xp-x86:
    runs-on: windows-latest

    steps:
      - name: Checkout iso2god-next
        uses: actions/checkout@v4
        with:
          repository: georgewoodall82/iso2god-next
          submodules: recursive

      - name: Verify Rust project
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.toml)) { throw "Cargo.toml not found - repo is not a Rust project" }

      - name: Install Rust (stable, i686 MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
          rustup default stable
          rustc -Vv

      - name: Download YY-Thunks (XP API shims)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Chuyu-Team/YY-Thunks --pattern "YY-Thunks-Objs.zip" --dir yy
          Expand-Archive yy\YY-Thunks-Objs.zip -DestinationPath yy\objs -Force
          $obj = Get-ChildItem yy\objs -Recurse -Filter "YY_Thunks_for_WinXP.obj" |
                 Where-Object { $_.FullName -match "x86" } | Select-Object -First 1
          if (-not $obj) { throw "YY_Thunks_for_WinXP.obj (x86) not found" }
          "YY_OBJ=$($obj.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build (i686, static CRT, subsystem 5.01)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static -C link-arg=/SUBSYSTEM:CONSOLE,5.01 -C link-arg=$env:YY_OBJ"
          cargo build --release --target i686-pc-windows-msvc

      - name: Verify PE header
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
                     Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          Get-ChildItem target\i686-pc-windows-msvc\release\*.exe | ForEach-Object {
            & $dumpbin.FullName /headers $_.FullName | Select-String "machine|subsystem version|operating system version"
          }

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item target\i686-pc-windows-msvc\release\*.exe output\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso2god-next-winxp-x86
          path: output/*.exe
